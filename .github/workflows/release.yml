name: Release Build

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri Application
        run: npm run tauri build

      - name: Verify and Prepare Artifact
        shell: pwsh
        run: |
          $releaseDir = "src-tauri/target/release"
          $exePath = Join-Path $releaseDir "AoE2_LAN_Launcher.exe"
          if (-not (Test-Path $exePath)) {
            $fallback = Join-Path $releaseDir "aoe2-launcher-tauri.exe"
            if (Test-Path $fallback) {
              Copy-Item $fallback $exePath -Force
            } else {
              throw "Executable not found in $releaseDir"
            }
          }
          Get-Item $exePath | Format-List Name, Length, LastWriteTime

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AoE2_LAN_Launcher
          path: src-tauri/target/release/AoE2_LAN_Launcher.exe

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $exe = "src-tauri/target/release/AoE2_LAN_Launcher.exe"
          gh release create $tag $exe --title "$tag" --generate-notes
