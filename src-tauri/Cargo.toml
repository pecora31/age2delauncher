[package]
name = "aoe2-launcher-tauri"
version = "0.1.0"
description = "Age of Empires II: DE Offline LAN Launcher"
authors = ["AoE2 Community"]
edition = "2024"

[lib]
name = "aoe2_launcher_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "AoE2_LAN_Launcher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
rand = "0.8"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
